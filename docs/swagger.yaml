        - listener
        type: string
      name:
        type: string
      type:
        enum:
        - value_change
        - percent_change
        - listener
        - tag
        type: string
    type: object
  DisembodiedSpecter_internal_dto_request.AdminUpdateCharacterReq:
    properties:
